---
- name: Check existence of exim-relay service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ exim_relay_identifier }}.service"
  register: exim_relay_service_stat

- name: Uninstall exim-relay systemd services and files
  when: exim_relay_service_stat.stat.exists | bool
  block:
    - name: Ensure exim-relay systemd service is stopped
      ansible.builtin.service:
        name: "{{ exim_relay_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure exim-relay systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ exim_relay_identifier }}.service"
        state: absent

    - name: Ensure exim-relay container network does not exist
      when: exim_relay_container_network_deletion_enabled and exim_relay_container_network != 'host'
      block:
        - name: Ensure exim-relay container network does not exist via community.docker.docker_network
          when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ exim_relay_container_network }}"
            state: absent
          register: exim_relay_network_deletion_result

        - name: Ensure exim-relay container network does not exist via ansible.builtin.command
          when: devture_systemd_docker_base_container_network_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} network rm
              {{ exim_relay_container_network }}
          register: exim_relay_network_deletion_result
          changed_when: exim_relay_container_network in exim_relay_network_deletion_result.stdout

    - name: Ensure exim-relay path does not exist
      ansible.builtin.file:
        path: "{{ exim_relay_base_path }}"
        state: absent
